<VirtualHost *:80>
    ServerName online-mart.local
    ServerAlias www.online-mart.local
    ServerAdmin webmaster@localhost
    
    DocumentRoot /home/somnang/Developer/Online_Mart
    
    <Directory /home/somnang/Developer/Online_Mart>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    ErrorLog ${APACHE_LOG_DIR}/online-mart-error.log
    CustomLog ${APACHE_LOG_DIR}/online-mart-access.log combined
</VirtualHost>

